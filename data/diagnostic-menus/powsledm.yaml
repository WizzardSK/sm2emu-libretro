game: {set: powsledm, parent: powsled, title: Power Sled, board: model2b, declared_manufacturer: Sega}
classification:
  gameplay_type: sled_racing
  control_family: special_power_sled
  observed_menu_family: main_operator_pages_inventoried
verification:
  status: service_menu_documented
  date: "2026-10-08"
  core_source_state: main plus uncommitted integration changes; Save State format 8
  method: retroarch_scripted_diagnostic_menu
  persistent_script: scripts/libretro_nvram_samples.powsledm.toml
  persistent_output: build-libretro-gpu/validation/power-sled-service-menu-20261008/powsledm
  captured: [boot, test_switch_response, service_switch_response, network_cancel_probe]
  validated: [isolated_srm_container, set_identity, extra_service_input, operator_page_navigation]
  pending: [country_region_interpretation, relay_hidden_byte_semantics, linked_gameplay]
  inheritance: not_verified
controls:
  service: DOWN
  service2_select: L3
  test: R3
  cancel_error: L
  cancel_network_check: R
  p1_entry: B
  p1_call: A
  p2_entry: Y
  p2_call: X
  note: Service B / Select maps L3 to IN0 bit 0x40; Service A maps D-Pad Down to IN0 bit 0x08 in the Test/Service profile. P1 Call confirms. Bindings swapped by user request on 2026-10-09; historical captures retain their original manifests.
