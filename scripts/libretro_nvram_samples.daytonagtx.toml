# Complete approved GTX campaign, generated from the independent Phase 1 inventory.
# Every acquired value is followed by a fresh-process reload stage.
[retroarch]
executable = "~/Retro/Apps/RetroArch/Nightly/RetroArch (ARM).app/Contents/MacOS/RetroArch"
core = "../build-libretro-gpu/libretro/sm2_libretro.dylib"
rom_dir = "/Volumes/MacBook External Drive/Retro/_Media/Sega - _Arcade (Model 2)/roms"
system_assets = "../data"
base_config = "~/Library/Application Support/RetroArch/config/retroarch.cfg"

[campaign]
game = "daytonagtx"
baseline_sample = "base"
output_dir = "../build-libretro-gpu/validation/nvram-campaigns/daytonagtx"
startup_wait = 20.0
button_hold = 0.12
button_hold_long = 0.8
default_wait = 0.22
settle_before_close = 0.3
close_gap = 0.5
shutdown_timeout = 15.0
window_width = 496
window_height = 384

[core_options]
sm2_renderer = "software"
sm2_controller_profile_type = "test_service"
sm2_initial_nvram_setup = "disabled"
sm2_nvram_settings = "disabled"

[macros]
Enter = ["R3", "WAIT(0.8)", "L3*2", "START", "WAIT(0.6)"]

[[samples]]
suffix = "base"
sequence = ["@Enter", "SCREENSHOT(first-boot)", "L3*4", "START*3", "L3*5", "START", "WAIT(0.5)", "L3*9", "START", "WAIT(2.0)", "CLOSE"]

[[samples]]
suffix = "base-reload"
sequence = ["@Enter", "SCREENSHOT(later-boot)", "START", "WAIT(0.5)", "L3*9", "START", "WAIT(2.0)", "CLOSE"]
reload_of = "base"

[[samples]]
suffix = "link-id-step-0"
sequence = ["@Enter", "L3*1", "SCREENSHOT(value)", "L3*8", "START", "WAIT(0.5)", "L3*9", "START", "WAIT(2.0)", "CLOSE"]
field = "link_id"
