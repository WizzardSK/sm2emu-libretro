sequence = ["R3", "WAIT(2.0)", "L3*6", "A", "WAIT(2.0)", "L3*4", "A", "WAIT(1.0)", "L3*4", "A", "SCREENSHOT(motion-use-default)", "L3*3", "A", "SCREENSHOT(motion-increase-1)", "A", "SCREENSHOT(motion-increase-2)", "A", "SCREENSHOT(motion-increase-3)", "L3", "A", "SCREENSHOT(motion-decrease-1)", "A", "SCREENSHOT(motion-decrease-2)", "A", "SCREENSHOT(motion-decrease-3)", "CLOSE"]
