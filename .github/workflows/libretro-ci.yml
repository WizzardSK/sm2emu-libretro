name: Libretro Core CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: libretro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Package corresponding source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - run: python3 scripts/package-libretro-source.py --output source-dist
      - uses: actions/upload-artifact@v7
        with:
          name: sm2-libretro-source
          path: source-dist/
          if-no-files-found: error
          retention-days: 14

  build:
    needs: source
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux x86_64, os: ubuntu-24.04, shell: bash, artifact: sm2-libretro-linux-x86_64, binary: sm2_libretro.so, lto: ON}
          - {name: Linux arm64, os: ubuntu-24.04-arm, shell: bash, artifact: sm2-libretro-linux-arm64, binary: sm2_libretro.so, lto: OFF}
          - {name: macOS Apple Silicon, os: macos-15, shell: bash, artifact: sm2-libretro-macos-arm64, binary: sm2_libretro.dylib, lto: OFF}
          - {name: macOS Intel, os: macos-15-intel, shell: bash, artifact: sm2-libretro-macos-x86_64, binary: sm2_libretro.dylib, lto: OFF}
          - {name: Windows x86_64, os: windows-2022, shell: 'msys2 {0}', artifact: sm2-libretro-windows-x86_64, binary: sm2_libretro.dll, lto: OFF}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Preserve canonical source bytes on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Verify native Linux arm64 runner
        if: matrix.os == 'ubuntu-24.04-arm'
        run: test "$(uname -m)" = aarch64
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ glslc libvulkan-dev libegl1-mesa-dev libgles2-mesa-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja shaderc vulkan-headers
      - name: Windows dependencies
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git file
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
            mingw-w64-x86_64-shaderc
            mingw-w64-x86_64-vulkan-headers
      - name: Configure core with software, Vulkan and OpenGL renderers
        run: |
          extra=()
          if [[ "$RUNNER_OS" == Linux ]]; then
            extra+=('-DCMAKE_SHARED_LINKER_FLAGS=-static-libgcc -static-libstdc++')
            extra+=('-DSM2_LIBRETRO_GL_CHECKS=ON')
          elif [[ "$RUNNER_OS" == macOS ]]; then
            extra+=("-DCMAKE_PREFIX_PATH=$(brew --prefix)" '-DCMAKE_OSX_DEPLOYMENT_TARGET=13.0')
          fi
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSM2_LTO=${{ matrix.lto }} \
            -DSM2_BUILD_STANDALONE=OFF -DSM2_BUILD_TESTS=OFF \
            -DSM2_BUILD_LIBRETRO=ON -DSM2_LIBRETRO_VULKAN=ON -DSM2_LIBRETRO_OPENGL=ON \
            -DSM2_BUILD_OPENGL_DESKTOP=OFF \
            -DSM2_LIBRETRO_CHECKS=ON -DSM2_LIBRETRO_GPU_CHECKS=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_miniz=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_pugixml=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_lzmasdk=TRUE "${extra[@]}"
      - name: Build
        run: cmake --build build-ci --parallel 3
      - name: Check inputs and Libretro ABI without ROMs
        run: |
          ./build-ci/bin/sm2-libretro-daytona-gtx-checks
          ./build-ci/bin/sm2-libretro-doa-protection-checks
          ./build-ci/bin/sm2-libretro-drive-reply-checks
          ./build-ci/bin/sm2-libretro-sgt24h-pedals-checks
          ./build-ci/bin/sm2-libretro-gun-flash-checks
          ./build-ci/bin/sm2-libretro-i960-checks
          ./build-ci/bin/sm2-libretro-audio-balance-checks
          ./build-ci/bin/sm2-libretro-audio-checks
          ./build-ci/bin/sm2-libretro-sound-timing-checks
          ./build-ci/bin/sm2-libretro-input-checks
          ./build-ci/bin/sm2-libretro-save-ram-checks
          ./build-ci/bin/sm2-libretro-netpacket-checks
          ./build-ci/bin/sm2-libretro-rumble-checks
          python3 scripts/check-libretro-artifact.py "build-ci/libretro/${{ matrix.binary }}"
      - name: Audit NVRAM catalogs
        if: runner.os == 'Linux'
        run: |
          ruby scripts/audit-diagnostic-yaml-catalog.rb
          python3 scripts/audit-nvram-core-catalog.py
      - uses: actions/download-artifact@v7
        with:
          name: sm2-libretro-source
          path: source-dist
      - name: Package core and matching game database
        run: |
          mkdir -p dist/system/sm2-emu dist/licenses
          cp "build-ci/libretro/${{ matrix.binary }}" dist/
          cp sm2_libretro.info LICENSE NOTICE dist/
          cp source-dist/SOURCE.json dist/
          cp licenses/BSD-3-Clause.txt dist/licenses/BSD-3-Clause.txt
          cp 3rdparty/imgui/LICENSE.txt dist/licenses/ImGui.txt
          cp data/games.xml dist/system/sm2-emu/
          cp CI.md dist/README.md
          cp 3rdparty/musashi/readme.txt dist/licenses/Musashi.txt
          cp 3rdparty/VulkanMemoryAllocator/LICENSE.txt dist/licenses/VulkanMemoryAllocator.txt
          cp 3rdparty/lzma-sdk/LICENSE dist/licenses/LZMA-SDK.txt
          cp 3rdparty/miniz/LICENSE dist/licenses/miniz.txt
          cp 3rdparty/pugixml/LICENSE.md dist/licenses/pugixml.txt
          cp 3rdparty/ymfm/LICENSE dist/licenses/ymfm.txt
          cp licenses/libretro-api.txt dist/licenses/libretro-api.txt
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          python3 -c 'import hashlib,pathlib; p=pathlib.Path("dist"); (p/"SHA256SUMS").write_text("".join(hashlib.sha256(f.read_bytes()).hexdigest()+"  "+f.relative_to(p).as_posix()+"\n" for f in sorted(p.rglob("*")) if f.is_file() and f.name != "SHA256SUMS"))'
          python3 scripts/check-libretro-package.py dist "${{ matrix.binary }}" --source-archive source-dist/*.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: sm2-libretro-*
          path: release/artifacts
      - name: Verify version and create platform archives
        run: |
          version="${GITHUB_REF_NAME#v}"
          info_version="$(sed -n 's/^display_version = "\([^"]*\)"/\1/p' sm2_libretro.info)"
          test -n "$version"
          test "$info_version" = "$version"
          grep -Fq "\"$version\"" src/libretro/core.cpp
          mkdir -p release/packages
          for directory in release/artifacts/sm2-libretro-*; do
            name="$(basename "$directory")"
            case "$name" in
              sm2-libretro-linux-*) binary=sm2_libretro.so ;;
              sm2-libretro-macos-*) binary=sm2_libretro.dylib ;;
              sm2-libretro-windows-*) binary=sm2_libretro.dll ;;
              sm2-libretro-source) continue ;;
              *) echo "Unexpected artifact: $name" >&2; exit 1 ;;
            esac
            python3 scripts/check-libretro-package.py "$directory" "$binary" --source-archive release/artifacts/sm2-libretro-source/*.tar.gz
            (cd "$directory" && zip -9 -r "../../packages/${name}-${version}.zip" .)
          done
          cp release/artifacts/sm2-libretro-source/*.tar.gz release/packages/
          (cd release/packages && sha256sum ./*.zip ./*.tar.gz > SHA256SUMS)
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/packages/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/packages/* \
              --verify-tag \
              --title "SM2-Emu Libretro ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
